services:
  - type: web
    name: casezero-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_PROVIDER
        value: gemini
      - key: FRONTEND_ORIGIN
        value: https://frontend-navy-five-76.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
